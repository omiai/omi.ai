<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秋葉結婚相談所 - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 42px;
            color: #667eea;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .email-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        input[type="email"] {
            flex: 1;
            min-width: 200px;
            padding: 14px 18px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #764ba2;
        }

        button {
            padding: 14px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .social-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #f0f0f0;
            color: #667eea;
            text-decoration: none;
            font-size: 20px;
            transition: all 0.3s;
        }

        .social-links a:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 32px;
            }

            .email-form {
                flex-direction: column;
            }

            input[type="email"] {
                min-width: unset;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">💍</div>
        <h1>秋葉結婚相談所</h1>

        <div class="email-form">
            <input type="email" placeholder="メールアドレスを入力" id="emailInput">
            <button onclick="subscribeEmail()">通知を受け取る</button>
        </div>

        <div class="social-links">
            <a href="#" title="Facebook" aria-label="Facebook">f</a>
            <a href="#" title="Twitter" aria-label="Twitter">𝕏</a>
            <a href="#" title="Instagram" aria-label="Instagram">📷</a>
            <a href="#" title="Line" aria-label="Line">💬</a>
        </div>
    </div>

    <script>
        // メール登録機能
        function subscribeEmail() {
            const email = document.getElementById('emailInput').value;
            if (email && email.includes('@')) {
                alert('ありがとうございます！\n登録いただいたメールアドレスに通知を送信します。');
                document.getElementById('emailInput').value = '';
            } else {
                alert('有効なメールアドレスを入力してください。');
            }
        }

        // Enterキーでも送信できるように
        document.getElementById('emailInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                subscribeEmail();
            }
        });
    </script>
</body>
</html>
