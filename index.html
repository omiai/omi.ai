<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秋葉結婚相談所 - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 42px;
            color: #667eea;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 18px;
            color: #764ba2;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .description {
            font-size: 16px;
            color: #666;
            line-height: 1.8;
            margin-bottom: 40px;
            text-align: left;
        }

        .description p {
            margin-bottom: 15px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .countdown-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            border-radius: 10px;
            min-width: 80px;
        }

        .countdown-number {
            font-size: 32px;
            font-weight: 700;
            display: block;
        }

        .countdown-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .email-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        input[type="email"] {
            flex: 1;
            min-width: 200px;
            padding: 14px 18px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #764ba2;
        }

        button {
            padding: 14px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .social-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #f0f0f0;
            color: #667eea;
            text-decoration: none;
            font-size: 20px;
            transition: all 0.3s;
        }

        .social-links a:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
        }

        .features {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            text-align: center;
        }

        .feature-item {
            padding: 20px;
        }

        .feature-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .feature-text {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 32px;
            }

            .countdown {
                gap: 10px;
            }

            .countdown-item {
                padding: 15px 18px;
                min-width: 70px;
            }

            .countdown-number {
                font-size: 24px;
            }

            .email-form {
                flex-direction: column;
            }

            input[type="email"] {
                min-width: unset;
            }

            .features-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">💍</div>
        <h1>秋葉結婚相談所</h1>
        <p class="subtitle">あなたの幸せな未来へ</p>

        <div class="description">
            <p>秋葉結婚相談所は、真摯な出会いと幸せな結婚を実現するお手伝いをする結婚相談所です。</p>
            <p>経験豊富なカウンセラーが、あなたの理想のパートナー探しをサポートします。</p>
        </div>

        <div class="countdown">
            <div class="countdown-item">
                <span class="countdown-number" id="days">00</span>
                <span class="countdown-label">日</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="hours">00</span>
                <span class="countdown-label">時間</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="minutes">00</span>
                <span class="countdown-label">分</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="seconds">00</span>
                <span class="countdown-label">秒</span>
            </div>
        </div>

        <div class="email-form">
            <input type="email" placeholder="メールアドレスを入力" id="emailInput">
            <button onclick="subscribeEmail()">通知を受け取る</button>
        </div>

        <div class="features">
            <div class="features-grid">
                <div class="feature-item">
                    <div class="feature-icon">🤝</div>
                    <div class="feature-text">専任カウンセラー</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🔒</div>
                    <div class="feature-text">プライバシー保護</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">✨</div>
                    <div class="feature-text">成婚実績多数</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📱</div>
                    <div class="feature-text">24/7サポート</div>
                </div>
            </div>
        </div>

        <div class="social-links">
            <a href="#" title="Facebook" aria-label="Facebook">f</a>
            <a href="#" title="Twitter" aria-label="Twitter">𝕏</a>
            <a href="#" title="Instagram" aria-label="Instagram">📷</a>
            <a href="#" title="Line" aria-label="Line">💬</a>
        </div>
    </div>

    <script>
        // カウントダウンタイマー
        function updateCountdown() {
            // オープン予定日を設定（例：2026年7月15日）
            const launchDate = new Date('2026-07-15').getTime();
            const now = new Date().getTime();
            const distance = launchDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            if (distance < 0) {
                document.querySelector('.countdown').innerHTML = '<p style="font-size: 24px; color: #667eea; font-weight: 700;">🎉 本日オープン！</p>';
            }
        }

        // 初期表示と定期更新
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // メール登録機能
        function subscribeEmail() {
            const email = document.getElementById('emailInput').value;
            if (email && email.includes('@')) {
                alert('ありがとうございます！\n登録いただいたメールアドレスに通知を送信します。');
                document.getElementById('emailInput').value = '';
            } else {
                alert('有効なメールアドレスを入力してください。');
            }
        }

        // Enterキーでも送信できるように
        document.getElementById('emailInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                subscribeEmail();
            }
        });
    </script>
</body>
</html>
